<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My Account | Ndago Market</title><link href="assets/css/bootstrap.min.css" rel="stylesheet"><link href="assets/css/style.css" rel="stylesheet"></head>
<body><nav class="navbar navbar-light bg-white shadow-sm"><div class="container"><a class="navbar-brand fw-bold" href="index.html"><span class="bg-primary-custom text-white rounded px-2 py-1 me-1">N</span>Ndago <span class="text-primary-custom">Market</span></a><a href="my-orders.html" class="btn btn-outline-success btn-sm">My orders</a></div></nav>
<main class="container py-4 py-lg-5"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><p class="text-primary-custom fw-semibold mb-1">CUSTOMER ACCOUNT</p><h1 class="h2 fw-bold mb-0">Hello, <span data-customer-name>customer</span></h1></div><div class="d-flex gap-2"><a href="seller-application.html" class="btn btn-outline-success">Become a seller</a><button class="btn btn-outline-secondary" type="button" data-logout>Log out</button></div></div><div class="alert alert-info">This is a frontend demonstration account. Account data is saved in this browser only.</div>
<div class="row g-4"><div class="col-lg-6"><section class="card border-0 shadow-sm h-100"><div class="card-body p-4"><h2 class="h5 fw-bold mb-3">Contact details</h2><form data-profile-form><div class="mb-3"><label class="form-label" for="profileName">Full name</label><input id="profileName" name="name" class="form-control" required maxlength="100"></div><div class="mb-3"><label class="form-label" for="profileEmail">Email</label><input id="profileEmail" name="email" type="email" class="form-control" required maxlength="160"></div><div class="mb-3"><label class="form-label" for="profilePhone">Phone</label><input id="profilePhone" name="phone" type="tel" class="form-control" required maxlength="40"></div><div class="mb-3"><label class="form-label" for="profileDistrict">District</label><select id="profileDistrict" name="district" class="form-select" required></select></div><button class="btn btn-primary-custom" type="submit">Save details</button></form></div></section></div>
<div class="col-lg-6"><section class="card border-0 shadow-sm mb-4"><div class="card-body p-4"><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h5 fw-bold mb-0">Saved addresses</h2><a href="checkout.html" class="small">Use at checkout</a></div><div data-address-list></div></div></section><section class="card border-0 shadow-sm"><div class="card-body p-4"><h3 class="h6 fw-bold">Add an address</h3><form data-address-form><div class="mb-3"><label class="form-label" for="addressLabel">Address label</label><input id="addressLabel" name="label" class="form-control" placeholder="Home" required maxlength="50"></div><div class="mb-3"><label class="form-label" for="addressText">Area and delivery details</label><textarea id="addressText" name="address" class="form-control" rows="2" required maxlength="300" placeholder="Area, street, nearby landmark"></textarea></div><div class="mb-3"><label class="form-label" for="addressDistrict">District</label><select id="addressDistrict" name="district" class="form-select" required></select></div><button class="btn btn-outline-success" type="submit">Save address</button></form></div></section></div></div></main>
<footer class="py-4 text-center text-muted small">© 2026 Ndago Market · <a href="index.html">Continue shopping</a></footer><script src="assets/js/bootstrap.bundle.min.js"></script><script src="assets/js/storage.js"></script><script src="assets/js/data.js"></script><script src="assets/js/utils.js"></script><script src="assets/js/auth.js"></script><script src="assets/js/customer.js"></script></body></html>
