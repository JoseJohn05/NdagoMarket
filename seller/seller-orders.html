<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders - Seller Dashboard | Ndago Market</title>
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light" data-seller-page="orders">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">
            <span class="bg-primary-custom text-white rounded px-2 py-1 me-1">N</span>
            Ndago <span class="text-primary-custom">Market</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <a href="add-product.html" class="btn btn-primary-custom btn-sm d-none d-sm-inline-flex"><i class="bi bi-plus-lg me-1"></i> Add Product</a>
            <div class="d-flex align-items-center gap-2">
                <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:36px;height:36px;" data-seller-initial> S</div>
                <span class="d-none d-sm-inline small fw-medium" data-seller-shop-name>Shop</span>
            </div>
        </div>
    </div>
</nav>

<div class="container py-4" data-seller-content>
    <div class="row g-4">
        <div class="col-lg-3">
            <div class="card border-0 shadow-sm sticky-top" style="top:80px;">
                <div class="list-group list-group-flush">
                    <a href="seller-dashboard.html" class="list-group-item list-group-item-action sidebar-link border-0"><i class="bi bi-house me-2"></i> Dashboard</a>
                    <a href="products.html" class="list-group-item list-group-item-action sidebar-link border-0"><i class="bi bi-box me-2"></i> My Products</a>
                    <a href="add-product.html" class="list-group-item list-group-item-action sidebar-link border-0"><i class="bi bi-plus-circle me-2"></i> Add Product</a>
                    <a href="seller-orders.html" class="list-group-item list-group-item-action sidebar-link active border-0"><i class="bi bi-receipt me-2"></i> Orders</a>
                    <a href="shop-profile.html" class="list-group-item list-group-item-action sidebar-link border-0"><i class="bi bi-person me-2"></i> Shop Profile</a>
                </div>
            </div>
        </div>

        <div class="col-lg-9">
            <h1 class="h4 fw-bold mb-1">Orders</h1>
            <p class="text-muted small mb-4">Manage customer orders</p>

            <div class="mb-4" style="max-width:260px">
                <label class="form-label small" for="sellerOrderFilter">Filter orders</label>
                <select id="sellerOrderFilter" class="form-select" data-order-filter>
                    <option value="">All statuses</option><option value="pending">Pending</option><option value="processing">Processing</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option>
            </div>

            <div data-seller-orders>
            <!-- Order 1 -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-header bg-white d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
                    <div>
                        <span class="fw-semibold">Order #NDG-1042</span>
                        <span class="badge bg-warning-subtle text-warning ms-2">Pending</span>
                        <div class="small text-muted">Placed 2 hours ago • by John Banda</div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary-custom btn-sm">Accept</button>
                        <button class="btn btn-outline-secondary btn-sm">Decline</button>
                    </div>
                </div>
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <img src="https://images.unsplash.com/photo-1596040033229-a9821ebd058d?w=80&h=80&fit=crop" class="rounded" width="56" height="56" style="object-fit:cover;">
                        <div class="flex-grow-1">
                            <div class="fw-medium">Fresh Organic Tomatoes (5kg)</div>
                            <small class="text-muted">Qty: 2 × MK 4,500</small>
                        </div>
                        <div class="fw-bold">MK 9,000</div>
                    </div>
                    <div class="row g-2 small">
                        <div class="col-sm-4"><span class="text-muted">Customer:</span> John Banda • 0888 123 456</div>
                        <div class="col-sm-4"><span class="text-muted">Delivery:</span> Pickup • Area 25</div>
                        <div class="col-sm-4"><span class="text-muted">Payment:</span> Cash on Pickup</div>
                    </div>
                </div>
            </div>

            <!-- Order 2 -->
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-header bg-white d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2">
                    <div>
                        <span class="fw-semibold">Order #NDG-1038</span>
                        <span class="badge bg-info-subtle text-info ms-2">Processing</span>
                        <div class="small text-muted">Placed Yesterday • by Mary Phiri</div>
                    </div>
                    <button class="btn btn-primary-custom btn-sm">Mark as Completed</button>
                </div>
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <img src="https://images.unsplash.com/photo-1607613009820-a29f7bb81c04?w=80&h=80&fit=crop" class="rounded" width="56" height="56" style="object-fit:cover;">
                        <div class="flex-grow-1">
                            <div class="fw-medium">White Maize Grain - 50kg</div>
                            <small class="text-muted">Qty: 1 × MK 45,000</small>
                        </div>
                        <div class="fw-bold">MK 45,000</div>
                    </div>
                    <div class="row g-2 small">
                        <div class="col-sm-4"><span class="text-muted">Customer:</span> Mary Phiri • 0999 876 543</div>
                        <div class="col-sm-4"><span class="text-muted">Delivery:</span> Seller Delivery • Area 47</div>
                        <div class="col-sm-4"><span class="text-muted">Payment:</span> Airtel Money</div>
                    </div>
                </div>
            </div>

            <!-- Order 3 -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white">
                    <span class="fw-semibold">Order #NDG-1029</span>
                    <span class="badge bg-success-subtle text-success ms-2">Completed</span>
                    <div class="small text-muted">Placed 3 days ago • by Peter Mwale</div>
                </div>
                <div class="card-body">
                    <div class="d-flex align-items-center gap-3 mb-3">
                        <img src="https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=80&h=80&fit=crop" class="rounded" width="56" height="56" style="object-fit:cover;">
                        <div class="flex-grow-1">
                            <div class="fw-medium">Red Onions - 5kg</div>
                            <small class="text-muted">Qty: 3 × MK 3,800</small>
                        </div>
                        <div class="fw-bold">MK 11,400</div>
                    </div>
                    <div class="row g-2 small">
                        <div class="col-sm-4"><span class="text-muted">Customer:</span> Peter Mwale • 0881 222 333</div>
                        <div class="col-sm-4"><span class="text-muted">Delivery:</span> Pickup • City Centre</div>
                        <div class="col-sm-4"><span class="text-muted">Payment:</span> Cash on Pickup</div>
                    </div>
                </div>
            </div>
            </div>
        </div>
    </div>
</div>

<script src="../assets/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/seller.js"></script>
</body>
</html>
