<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Profile - Seller Dashboard | Ndago Market</title>
    <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light" data-seller-page="profile">

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">
            <span class="bg-primary-custom text-white rounded px-2 py-1 me-1">N</span>
            Ndago <span class="text-primary-custom">Market</span>
        </a>
        <div class="d-flex align-items-center gap-3">
            <a href="add-product.html" class="btn btn-primary-custom btn-sm d-none d-sm-inline-flex"><i class="bi bi-plus-lg me-1"></i> Add Product</a>
            <div class="d-flex align-items-center gap-2">
                <div class="bg-success bg-opacity-10 text-success rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width:36px;height:36px;" data-seller-initial> S</div>
                <span class="d-none d-sm-inline small fw-medium" data-seller-shop-name>Shop</span>
            </div>
        </div>
    </div>
</nav>

<div class="container py-4" data-seller-content>
    <div class="row g-4">
        <div class="col-lg-3">
            <div class="card border-0 shadow-sm sticky-top" style="top:80px;">
                <div class="list-group list-group-flush">
                    <a href="seller-dashboard.html" class="list-group-item list-group-item-action sidebar-link border-0"><i class="bi bi-house me-2"></i> Dashboard</a>
                    <a href="products.html" class="list-group-item list-group-item-action sidebar-link border-0"><i class="bi bi-box me-2"></i> My Products</a>
                    <a href="add-product.html" class="list-group-item list-group-item-action sidebar-link border-0"><i class="bi bi-plus-circle me-2"></i> Add Product</a>
                    <a href="seller-orders.html" class="list-group-item list-group-item-action sidebar-link border-0"><i class="bi bi-receipt me-2"></i> Orders</a>
                    <a href="shop-profile.html" class="list-group-item list-group-item-action sidebar-link active border-0"><i class="bi bi-person me-2"></i> Shop Profile</a>
                </div>
            </div>
        </div>

        <div class="col-lg-9">
            <h1 class="h4 fw-bold mb-1">Shop Profile</h1>
            <p class="text-muted small mb-4">Manage how your shop appears to customers</p>

            <form data-shop-profile>
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3">Shop Appearance</h6>
                        <div class="mb-4">
                            <label class="form-label">Shop Logo</label>
                            <div class="d-flex align-items-center gap-3 flex-wrap">
                                <img src="../assets/imgs/placeholder.svg" data-profile-logo alt="Shop logo preview" class="rounded-circle border" width="80" height="80" style="object-fit:cover">
                                <input type="file" class="form-control" name="logoImage" accept="image/*" aria-label="Upload shop logo" style="max-width:320px">
                            </div>
                        </div>
                        <div>
                            <label class="form-label">Cover Banner</label>
                            <img src="../assets/imgs/placeholder.svg" data-profile-cover alt="Shop cover preview" class="img-fluid rounded border mb-2" style="max-height:150px;object-fit:cover;width:100%">
                            <input type="file" class="form-control" name="coverImage" accept="image/*" aria-label="Upload shop cover">
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3">Basic Information</h6>
                        <div class="mb-3">
                            <label class="form-label">Shop Name *</label>
                            <input type="text" class="form-control" name="shopName" required maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Shop Description</label>
                            <textarea class="form-control" rows="3" name="description" maxlength="1000"></textarea>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Phone Number *</label>
                                <input type="tel" class="form-control" name="phone" required maxlength="40">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">WhatsApp Number</label>
                                <input type="tel" class="form-control" name="whatsapp" maxlength="40">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" maxlength="160">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body">
                        <h6 class="fw-bold mb-3">Location</h6>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">District *</label>
                                <select class="form-select" name="district" required>
                                    <option value="">Select district</option>
                                    <option>Balaka</option><option>Blantyre</option><option>Chikwawa</option><option>Chiradzulu</option><option>Chitipa</option><option>Dedza</option><option>Dowa</option><option>Karonga</option><option>Kasungu</option><option>Likoma</option><option>Lilongwe</option><option>Machinga</option><option>Mangochi</option><option>Mchinji</option><option>Mulanje</option><option>Mwanza</option><option>Mzimba</option><option>Nkhata Bay</option><option>Nkhotakota</option><option>Nsanje</option><option>Ntcheu</option><option>Ntchisi</option><option>Phalombe</option><option>Rumphi</option><option>Salima</option><option>Thyolo</option><option>Zomba</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Area / Address</label>
                                <input type="text" class="form-control" name="address" maxlength="300">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a href="seller-dashboard.html" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary-custom">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../assets/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/storage.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/utils.js"></script>
<script src="../assets/js/navigation.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/seller.js"></script>
</body>
</html>
