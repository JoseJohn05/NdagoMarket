<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Ndago Market</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex flex-column">

<nav class="navbar navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">
            <span class="bg-primary-custom text-white rounded px-2 py-1 me-1">N</span>
            Ndago <span class="text-primary-custom">Market</span>
        </a>
        <a href="login.html" class="btn btn-outline-secondary btn-sm">Already have an account?</a>
    </div>
</nav>

<main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h1 class="h3 fw-bold">Create your account</h1>
                            <p class="text-muted">Join Ndago Market as a buyer or seller</p>
                        </div>

                        <!-- Account Type Tabs -->
                        <ul class="nav nav-pills nav-fill mb-4" id="accountTypeTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="buyer-tab" data-bs-toggle="pill" data-bs-target="#buyer-form" type="button" role="tab">
                                    <i class="bi bi-person me-1"></i> I want to Buy
                                </button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="seller-tab" data-bs-toggle="pill" data-bs-target="#seller-form" type="button" role="tab">
                                    <i class="bi bi-shop me-1"></i> I want to Sell
                                </button>
                            </li>
                        </ul>

                        <div class="tab-content" id="accountTypeTabContent">

                            <!-- ========== BUYER FORM ========== -->
                            <div class="tab-pane fade show active" id="buyer-form" role="tabpanel">
                                <form>
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label">First Name *</label>
                                            <input type="text" class="form-control" placeholder="John" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Last Name *</label>
                                            <input type="text" class="form-control" placeholder="Banda" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Email *</label>
                                            <input type="email" class="form-control" placeholder="you@example.com" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Phone Number *</label>
                                            <input type="tel" class="form-control" placeholder="0888 123 456" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">District *</label>
                                            <select class="form-select" required>
                                                <option value="">Select your district</option>
                                                <option>Lilongwe</option>
                                                <option>Blantyre</option>
                                                <option>Mzuzu</option>
                                                <option>Zomba</option>
                                                <option>Kasungu</option>
                                                <option>Mangochi</option>
                                                <option>Other</option>
                                            </select>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Password *</label>
                                            <input type="password" class="form-control" placeholder="Minimum 8 characters" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Confirm Password *</label>
                                            <input type="password" class="form-control" placeholder="Repeat password" required>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="buyerTerms" required>
                                                <label class="form-check-label small" for="buyerTerms">
                                                    I agree to the <a href="#" class="text-primary-custom">Terms of Service</a> and <a href="#" class="text-primary-custom">Privacy Policy</a>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <button type="submit" class="btn btn-primary-custom w-100 py-2">Create Buyer Account</button>
                                        </div>
                                    </div>
                                </form>
                            </div>

                            <!-- ========== SELLER FORM ========== -->
                            <div class="tab-pane fade" id="seller-form" role="tabpanel">
                                <form>
                                    <div class="row g-3">
                                        <div class="col-md-6">
                                            <label class="form-label">First Name *</label>
                                            <input type="text" class="form-control" placeholder="John" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Last Name *</label>
                                            <input type="text" class="form-control" placeholder="Banda" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Shop / Business Name *</label>
                                            <input type="text" class="form-control" placeholder="e.g. GreenFarm or StyleHub" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Email *</label>
                                            <input type="email" class="form-control" placeholder="you@example.com" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Phone Number *</label>
                                            <input type="tel" class="form-control" placeholder="0888 123 456" required>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">District *</label>
                                            <select class="form-select" required>
                                                <option value="">Select district</option>
                                                <option>Lilongwe</option>
                                                <option>Blantyre</option>
                                                <option>Mzuzu</option>
                                                <option>Zomba</option>
                                                <option>Kasungu</option>
                                                <option>Mangochi</option>
                                                <option>Other</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6">
                                            <label class="form-label">Main Category *</label>
                                            <select class="form-select" required>
                                                <option value="">Select category</option>
                                                <option>Agriculture</option>
                                                <option>Clothes</option>
                                                <option>Electronics</option>
                                                <option>Furniture</option>
                                                <option>Building Materials</option>
                                                <option>Beauty</option>
                                                <option>Other</option>
                                            </select>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Password *</label>
                                            <input type="password" class="form-control" placeholder="Minimum 8 characters" required>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Confirm Password *</label>
                                            <input type="password" class="form-control" placeholder="Repeat password" required>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="sellerTerms" required>
                                                <label class="form-check-label small" for="sellerTerms">
                                                    I agree to the <a href="#" class="text-primary-custom">Terms of Service</a>, <a href="#" class="text-primary-custom">Seller Guidelines</a> and <a href="#" class="text-primary-custom">Privacy Policy</a>
                                                </label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <button type="submit" class="btn btn-primary-custom w-100 py-2">Create Seller Account</button>
                                        </div>
                                    </div>
                                </form>
                            </div>

                        </div>

                        <p class="text-center text-muted small mt-4 mb-0">
                            Already have an account? <a href="login.html" class="text-primary-custom fw-medium">Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer class="py-3 text-center text-muted small">
    © 2026 Ndago Market. All rights reserved.
</footer>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/utils.js"></script>
<script src="assets/js/navigation.js"></script>
<script src="assets/js/app.js"></script>
<script>
    window.addEventListener('DOMContentLoaded' , () =>{
        //Check if URL contains #seller-form hash
        if(window.location.hash === '#seller-form'){
            const sellerTab = document.querySelector('#seller-tab');

            if(sellerTab){
                sellerTab.click();
            }
        }
    });
</script>
</body>
</html>
